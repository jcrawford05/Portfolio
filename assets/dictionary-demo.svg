<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" role="img" aria-labelledby="title desc">
  <title id="title">Dictionary application console preview</title>
  <desc id="desc">A dark console interface showing a word lookup, range query, and runtime metadata.</desc>
  <rect width="1000" height="640" fill="#202329"/>
  <rect x="42" y="38" width="916" height="564" rx="2" fill="#2a2d34" stroke="#e7d7c1" stroke-opacity=".2"/>
  <circle cx="75" cy="73" r="7" fill="#bf4342"/><circle cx="99" cy="73" r="7" fill="#c6a25c"/><circle cx="123" cy="73" r="7" fill="#558564"/>
  <text x="164" y="78" fill="#a78a7f" font-family="monospace" font-size="13">dictionary-demo / analysis</text>
  <line x1="70" y1="110" x2="930" y2="110" stroke="#e7d7c1" stroke-opacity=".13"/>
  <g font-family="monospace" font-size="15"><text x="78" y="155" fill="#558564">$</text><text x="101" y="155" fill="#e7d7c1">java DictionaryApp --query "analysis"</text><text x="78" y="195" fill="#a78a7f">LOOKUP RESULT</text><text x="78" y="230" fill="#e7d7c1">analysis</text><text x="78" y="257" fill="#558564">noun</text><text x="78" y="286" fill="#e7d7c1">detailed examination of a complex subject</text><text x="78" y="345" fill="#558564">$</text><text x="101" y="345" fill="#e7d7c1">range --from alpha --to delta</text><text x="78" y="385" fill="#a78a7f">RANGE QUERY</text><text x="78" y="421" fill="#e7d7c1">alpha   bravo   charlie   delta</text><text x="78" y="487" fill="#558564">RUNTIME METADATA</text><text x="78" y="520" fill="#a78a7f">lookup: 0.08 ms</text><text x="310" y="520" fill="#a78a7f">range: 0.21 ms</text></g>
  <rect x="744" y="164" width="147" height="262" fill="#3a3b43" stroke="#558564" stroke-opacity=".7"/><text x="767" y="201" fill="#558564" font-family="Arial, sans-serif" font-size="11" font-weight="700">SYSTEM NOTES</text><text x="767" y="242" fill="#e7d7c1" font-family="Arial, sans-serif" font-size="12">Custom data</text><text x="767" y="264" fill="#e7d7c1" font-family="Arial, sans-serif" font-size="12">structure</text><text x="767" y="311" fill="#e7d7c1" font-family="Arial, sans-serif" font-size="12">Predictable</text><text x="767" y="333" fill="#e7d7c1" font-family="Arial, sans-serif" font-size="12">runtime</text><text x="767" y="380" fill="#e7d7c1" font-family="Arial, sans-serif" font-size="12">Java → web</text>
</svg>

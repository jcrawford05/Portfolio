  </g>
  <rect x="780" y="155" width="125" height="35" fill="#558564"/><text x="803" y="178" fill="#e7d7c1" font-family="Arial, sans-serif" font-size="11" font-weight="700">MODEL CHECK</text>
  <text x="780" y="229" fill="#a78a7f" font-family="Arial, sans-serif" font-size="11">Each point is a state.</text><text x="780" y="250" fill="#a78a7f" font-family="Arial, sans-serif" font-size="11">No causal claim implied.</text>
